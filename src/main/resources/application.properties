# ===============================
# DATABASE (Docker MySQL)
# ===============================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://192.168.0.104:3307/authservice?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=remoteuser
spring.datasource.password=password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# SERVER
# ===============================
server.port=9898

# ===============================
# LOGGING
# ===============================
logging.level.com.example.authservice=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ===============================
# KAFKA (Docker Kafka)
# ===============================
spring.kafka.bootstrap-servers=192.168.0.104:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.topic.name=user_service
spring.kafka.producer.properties.spring.json.type.mapping=auth:com.spring.authservice.models.UserInfoDto
