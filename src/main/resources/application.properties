spring.application.name=authservice

# ===============================
# SERVER
# ===============================
server.port=9898

# ===============================
# DATABASE (Docker internal network)
# ===============================
spring.datasource.url=jdbc:mysql://auth-db:3306/authservice?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=test
spring.datasource.password=test123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# ===============================
# KAFKA (Docker internal network)
# ===============================
spring.kafka.bootstrap-servers=kafka:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Important ? prevents classpath mismatch between services
spring.kafka.producer.properties.spring.json.add.type.headers=false

spring.kafka.topic.name=user_service

# ===============================
# LOGGING
# ===============================
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.apache.kafka=DEBUG
logging.level.org.springframework.kafka=DEBUG